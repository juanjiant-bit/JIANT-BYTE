name: Android published engine updates
on:
  push:
    branches: [codex/byte-identity-generator]
    paths: ['android/engine-check/**', '.github/workflows/android-engine-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fm-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build instrumentation only; keep the published APK
        run: |
          cp android/engine-check/FMUpdateTest.java android/emulator/app/src/androidTest/java/fm/jiant/emulator/
          gradle -p android/emulator assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real APK0.2 FM46/47 to 48/49, saved flash and offline audio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash android/engine-check/test-fm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-fm-update-reports
          path: android/engine-check/reports/
