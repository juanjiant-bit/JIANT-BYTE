# SPDX-License-Identifier: GPL-3.0-only
# Build one matching emulator + installer and update the existing gh-pages site.
# Current development firmware is published directly, as requested; older packages remain selectable.
name: emulator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow numpy fonttools
      - name: generated headers (fonts, icons, palettes, shapes, tables, samples)
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11                # (the version the emulator is tested with)
      - name: the emulator
        run: |
          EMU_PREVIEW=0 sh web/emu/build.sh
          node web/emu/emu_test.mjs build/emu/felucca.wasm
      # (JIANT) the installer and the web editor next to the emulator: the package needs JieLi's toolchain (downloaded)
      # and three pinned AC79 SDK files. Publish only when the matching preview package is ready.
      - name: JieLi toolchain and SDK files (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-d179b448-v2
      - name: JieLi toolchain and SDK files
        id: tc
        run: |
          # Transient download failures: retry with backoff; the cache keeps the pinned SDK files.
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://github.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout d179b4484759423312073f5fbb232501aa491047
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: the package, the installer and the editor
        if: steps.tc.outcome == 'success'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          FELUCCA_REPIN: "1"                 # (byte-cpu-light: the audio layout re-pinned for the new code)
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          ver() { sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' "$1/firmware/src/felucca.c" | head -1; }
          python3 tools/build.py
          V=$(ver .)
          python3 web/fetch_prev.py "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" build/prev || true
          python3 web/make_site.py build/felucca.fwsc "${V:-dev}-${GITHUB_SHA::7}" build/site build/prev
          cp -r build/site/webapp build/site/firmware build/emu/
      # (JIANT 0.7.9) the stems app's phase-0 probe (android/probe), next to the installer: app/jiant-probe.apk
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: "8.9"
      - name: the Android probe
        continue-on-error: true
        run: |
          gradle -p android/probe assembleDebug --no-daemon
          mkdir -p build/emu/app
          cp android/probe/app/build/outputs/apk/debug/app-debug.apk build/emu/app/jiant-probe.apk
      # (JIANT Stems 1.0) the stems app (android/stems) beside it: app/jiant-stems.apk
      - name: the Android stems app
        continue-on-error: true
        run: |
          gradle -p android/stems :app:assembleDebug --no-daemon
          mkdir -p build/emu/app
          cp android/stems/app/build/outputs/apk/debug/app-debug.apk build/emu/app/jiant-stems.apk
      # (JIANT 0.8.1) the site's front page (web/landing: what JIANT is, install / try / edit, what comes next) at the
      # root, for people who just want to play; the emulator moves to emu/ (its links go up one level)
      - name: the front page and the emulator under emu/
        run: |
          mkdir -p build/pages/emu
          for f in index.html build.json worklet.js stems.js fm1backup.js felucca.wasm fonts; do
            if [ -e "build/emu/$f" ]; then mv "build/emu/$f" build/pages/emu/; fi
          done
          cp -r build/emu/. build/pages/
          cp web/landing/index.html build/pages/index.html
          cp web/landing/frecuencia.html build/pages/frecuencia.html
          mkdir -p build/pages/docs && cp docs/cheatsheet-controls.pdf docs/cheatsheet-sound.pdf docs/cheatsheet-controls.png docs/cheatsheet-sound.png build/pages/docs/
          # (0.9.2) the navigation map the front page shows (tools/gen_nav_map.py), English and Spanish
          cp docs/navigation-map.png docs/navigation-map.svg docs/navigation-map.es.png docs/navigation-map.es.svg build/pages/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: byte-site
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: byte-site
          path: /tmp/byte-site
      - name: publish to the existing Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Preserve other published assets; replace only directories built in this run.
          for d in emu webapp firmware; do rm -rf "$d"; cp -r "/tmp/byte-site/$d" "$d"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emu webapp firmware
          if ! git diff --cached --quiet; then
            git commit -m "Publish JIANT /B1T3 ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
            # GITHUB_TOKEN pushes do not trigger Pages automatically.
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
